<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Box</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      tab-size: 2;
      -moz-tab-size: 2;
    }

    /* Custom clean scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .editor-textarea {
      resize: none;
      outline: none;
      border: none;
      background: #ffffff;
      color: #1e293b;
      line-height: 1.6;
      white-space: pre;
      overflow: auto;
    }

    .line-numbers {
      user-select: none;
      text-align: right;
      line-height: 1.6;
      color: #94a3b8;
      background-color: #f8fafc;
      border-right: 1px solid #e2e8f0;
      overflow: hidden;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden bg-slate-50 text-slate-900">

  <!-- Top Header -->
  <header class="h-13 bg-white border-b border-slate-200 px-3 flex items-center justify-between gap-2 flex-shrink-0 z-20">
    <!-- Left: Sidebar Toggle, Brand, New (+), Delete All -->
    <div class="flex items-center gap-2 min-w-0">
      <button id="toggleSidebarBtn" title="サイドバー開閉" class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 transition-colors flex-shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="flex items-center gap-2 pr-2 border-r border-slate-200 flex-shrink-0">
        <div class="w-6 h-6 rounded bg-[#6D28D9] flex items-center justify-center text-white font-bold text-xs tracking-tighter">
          &lt;/&gt;
        </div>
        <span class="font-bold text-sm tracking-tight text-slate-900">HTML Box</span>
      </div>

      <!-- New Project (+) and Delete All Buttons -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button id="newProjectBtn" title="新規プロジェクト作成" class="h-8 px-2.5 rounded bg-[#6D28D9] hover:bg-[#5B21B6] text-white text-xs font-medium flex items-center gap-1 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          <span>新規作成</span>
        </button>

        <button id="deleteAllBtn" title="すべてのプロジェクトを削除" class="h-8 px-2.5 rounded border border-slate-200 bg-white hover:bg-red-50 hover:text-red-600 hover:border-red-200 text-slate-600 text-xs font-medium flex items-center gap-1 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span>全削除</span>
        </button>
      </div>
    </div>

    <!-- Center: JSBin-style Multi-Select Panel Toggles -->
    <div class="flex items-center bg-slate-100 p-0.5 rounded border border-slate-200 flex-shrink-0">
      <button data-pane="html" class="pane-toggle px-3 py-1 text-xs font-semibold rounded transition-colors bg-[#6D28D9] text-white">HTML</button>
      <button data-pane="css" class="pane-toggle px-3 py-1 text-xs font-semibold rounded transition-colors text-slate-600 hover:text-slate-900">CSS</button>
      <button data-pane="js" class="pane-toggle px-3 py-1 text-xs font-semibold rounded transition-colors text-slate-600 hover:text-slate-900">JS</button>
      <button data-pane="preview" class="pane-toggle px-3 py-1 text-xs font-semibold rounded transition-colors bg-[#6D28D9] text-white">Preview</button>
    </div>

    <!-- Right: Active Project Title, Open Count, Share & Export -->
    <div class="flex items-center gap-2 min-w-0">
      <!-- Editable Project Title -->
      <input id="activeTitleInput" type="text" value="Project 1" aria-label="プロジェクト名"
        class="h-8 px-2.5 text-xs font-semibold bg-slate-50 border border-slate-200 rounded text-slate-800 focus:outline-none focus:border-[#6D28D9] focus:bg-white w-28 sm:w-36 truncate" />

      <!-- Per-Project Open Count Badge -->
      <div class="h-8 px-2.5 rounded border border-slate-200 bg-slate-50 flex items-center gap-1.5 text-xs flex-shrink-0" title="このプロジェクトが開かれた回数">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span class="text-slate-500 font-medium">Open</span>
        <span id="activeOpenCount" class="font-bold text-slate-800 tabular-nums">0</span>
      </div>

      <!-- Open in New Tab -->
      <button id="openTabBtn" title="新しいタブで開く (Open +1)" class="h-8 px-2.5 rounded border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium flex items-center gap-1.5 transition-colors flex-shrink-0">
        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        <span class="hidden md:inline">別タブ表示</span>
      </button>

      <!-- Share URL -->
      <button id="shareBtn" class="h-8 px-3 rounded bg-[#6D28D9] hover:bg-[#5B21B6] text-white text-xs font-medium flex items-center gap-1.5 transition-colors flex-shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
        </svg>
        <span>共有</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex flex-1 min-h-0 min-w-0 overflow-hidden">

    <!-- Left Sidebar: Projects List -->
    <aside id="projectSidebar" class="w-60 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 select-none">
      <div class="h-9 px-3 border-b border-slate-200 flex items-center justify-between bg-slate-50/70">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Projects</span>
        <div class="flex items-center gap-1">
          <label for="importFileInput" title="HTMLファイルをインポート" class="cursor-pointer px-1.5 py-0.5 text-[11px] font-medium text-slate-600 hover:text-[#6D28D9] hover:bg-slate-200/60 rounded transition-colors">
            読込
          </label>
          <input id="importFileInput" type="file" accept=".html,.htm,.txt" class="hidden" />
          <button id="exportHtmlBtn" title="単一HTMLファイルとして保存" class="px-1.5 py-0.5 text-[11px] font-medium text-slate-600 hover:text-[#6D28D9] hover:bg-slate-200/60 rounded transition-colors">
            保存
          </button>
        </div>
      </div>

      <!-- Project Items Container -->
      <div id="projectList" class="flex-1 overflow-y-auto p-1.5 space-y-0.5">
        <!-- Rendered dynamically -->
      </div>

      <!-- Footer Info -->
      <div class="p-2.5 border-t border-slate-200 bg-slate-50 text-[11px] text-slate-500 flex items-center justify-between">
        <span>ローカル自動保存</span>
        <span class="inline-flex items-center gap-1 text-slate-600 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-[#6D28D9]"></span>
          Sync Ready
        </span>
      </div>
    </aside>

    <!-- Multi-Pane Editor & Preview Area -->
    <main id="panesContainer" class="flex-1 flex min-w-0 min-h-0 overflow-hidden bg-slate-200 gap-px">

      <!-- HTML Pane -->
      <section id="pane-html" class="flex-1 flex flex-col min-w-0 min-h-0 bg-white">
        <div class="h-8 px-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
          <span class="text-xs font-bold text-slate-700 tracking-wide">HTML</span>
          <span id="html-lines-badge" class="text-[11px] text-slate-400 font-mono-code">1 ln</span>
        </div>
        <div class="flex-1 flex min-h-0 min-w-0 relative">
          <div id="lines-html" class="line-numbers w-10 py-2.5 pr-2 text-xs font-mono-code flex-shrink-0">1</div>
          <textarea id="code-html" spellcheck="false" placeholder="HTMLを入力..."
            class="editor-textarea flex-1 w-full h-full p-2.5 text-xs font-mono-code"></textarea>
        </div>
      </section>

      <!-- CSS Pane -->
      <section id="pane-css" class="hidden flex-1 flex-col min-w-0 min-h-0 bg-white">
        <div class="h-8 px-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
          <span class="text-xs font-bold text-slate-700 tracking-wide">CSS</span>
          <span id="css-lines-badge" class="text-[11px] text-slate-400 font-mono-code">1 ln</span>
        </div>
        <div class="flex-1 flex min-h-0 min-w-0 relative">
          <div id="lines-css" class="line-numbers w-10 py-2.5 pr-2 text-xs font-mono-code flex-shrink-0">1</div>
          <textarea id="code-css" spellcheck="false" placeholder="CSSを入力..."
            class="editor-textarea flex-1 w-full h-full p-2.5 text-xs font-mono-code"></textarea>
        </div>
      </section>

      <!-- JS Pane -->
      <section id="pane-js" class="hidden flex-1 flex-col min-w-0 min-h-0 bg-white">
        <div class="h-8 px-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
          <span class="text-xs font-bold text-slate-700 tracking-wide">JavaScript</span>
          <span id="js-lines-badge" class="text-[11px] text-slate-400 font-mono-code">1 ln</span>
        </div>
        <div class="flex-1 flex min-h-0 min-w-0 relative">
          <div id="lines-js" class="line-numbers w-10 py-2.5 pr-2 text-xs font-mono-code flex-shrink-0">1</div>
          <textarea id="code-js" spellcheck="false" placeholder="JavaScriptを入力..."
            class="editor-textarea flex-1 w-full h-full p-2.5 text-xs font-mono-code"></textarea>
        </div>
      </section>

      <!-- Preview Pane -->
      <section id="pane-preview" class="flex-1 flex flex-col min-w-0 min-h-0 bg-white">
        <div class="h-8 px-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-700 tracking-wide">Preview</span>
          </div>
          <button id="refreshPreviewBtn" title="プレビュー再読み込み" class="text-[11px] text-slate-500 hover:text-[#6D28D9] font-medium px-1.5 py-0.5 rounded hover:bg-slate-200/60 transition-colors">
            再読込
          </button>
        </div>
        <div class="flex-1 min-h-0 min-w-0 bg-white relative">
          <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin" class="w-full h-full border-0 block bg-white"></iframe>
        </div>
      </section>

    </main>
  </div>

  <!-- Share Modal -->
  <div id="shareModal" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-lg w-full max-w-md shadow-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <h3 class="text-sm font-bold text-slate-800">共有リンク</h3>
        <button id="closeShareModalBtn" class="text-slate-400 hover:text-slate-700 text-lg leading-none">&times;</button>
      </div>
      <div class="p-4 space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">圧縮共有URL（開くとOpenカウント+1）</label>
          <div class="flex gap-1.5">
            <input id="shareUrlInput" type="text" readonly class="flex-1 h-8 px-2.5 text-xs bg-slate-50 border border-slate-200 rounded font-mono-code text-slate-700 focus:outline-none" />
            <button id="copyShareUrlBtn" class="h-8 px-3 rounded bg-[#6D28D9] hover:bg-[#5B21B6] text-white text-xs font-medium transition-colors flex-shrink-0">
              コピー
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">直リンク（Data URI形式）</label>
          <div class="flex gap-1.5">
            <input id="dataUriInput" type="text" readonly class="flex-1 h-8 px-2.5 text-xs bg-slate-50 border border-slate-200 rounded font-mono-code text-slate-700 focus:outline-none" />
            <button id="copyDataUriBtn" class="h-8 px-3 rounded border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium transition-colors flex-shrink-0">
              コピー
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal (Delete All / Single Delete) -->
  <div id="confirmModal" class="hidden fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-lg w-full max-w-sm shadow-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 bg-slate-50">
        <h3 id="confirmTitle" class="text-sm font-bold text-slate-800">確認</h3>
      </div>
      <div class="p-4">
        <p id="confirmMessage" class="text-xs text-slate-600 leading-relaxed">本当に削除しますか？この操作は取り消せません。</p>
      </div>
      <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
        <button id="confirmCancelBtn" class="h-8 px-3 rounded border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 text-xs font-medium transition-colors">
          キャンセル
        </button>
        <button id="confirmOkBtn" class="h-8 px-3 rounded bg-red-600 hover:bg-red-700 text-white text-xs font-medium transition-colors">
          削除する
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-4 right-4 bg-slate-900 text-white text-xs font-medium px-3.5 py-2 rounded shadow-md z-50">
    コピーしました
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'html_box_projects_v3';
      const ACTIVE_ID_KEY = 'html_box_active_id_v3';
      const PANES_KEY = 'html_box_panes_v3';
      const SIDEBAR_KEY = 'html_box_sidebar_v3';

      // BroadcastChannel for real-time cross-tab synchronization
      const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('html_box_sync') : null;

      let projects = [];
      let activeProjectId = null;
      let visiblePanes = { html: true, css: false, js: false, preview: true };
      let sidebarOpen = true;
      let confirmCallback = null;

      // DOM Elements
      const projectSidebar = document.getElementById('projectSidebar');
      const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
      const projectListEl = document.getElementById('projectList');
      const newProjectBtn = document.getElementById('newProjectBtn');
      const deleteAllBtn = document.getElementById('deleteAllBtn');
      const activeTitleInput = document.getElementById('activeTitleInput');
      const activeOpenCountEl = document.getElementById('activeOpenCount');
      const openTabBtn = document.getElementById('openTabBtn');
      const shareBtn = document.getElementById('shareBtn');
      const exportHtmlBtn = document.getElementById('exportHtmlBtn');
      const importFileInput = document.getElementById('importFileInput');
      const refreshPreviewBtn = document.getElementById('refreshPreviewBtn');

      const editors = {
        html: document.getElementById('code-html'),
        css: document.getElementById('code-css'),
        js: document.getElementById('code-js')
      };

      const lineEls = {
        html: document.getElementById('lines-html'),
        css: document.getElementById('lines-css'),
        js: document.getElementById('lines-js')
      };

      const lineBadges = {
        html: document.getElementById('html-lines-badge'),
        css: document.getElementById('css-lines-badge'),
        js: document.getElementById('js-lines-badge')
      };

      const previewFrame = document.getElementById('previewFrame');

      // Utility: Generate unique ID
      function generateId() {
        return 'proj_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      // Utility: Smallest unused integer N >= 1 for "Project N"
      function getNextSmallestProjectName(existingProjects) {
        const usedNumbers = new Set();
        existingProjects.forEach(p => {
          const match = p.title.trim().match(/^Project\s+(\d+)$/i);
          if (match) {
            const num = parseInt(match[1], 10);
            if (num >= 1) usedNumbers.add(num);
          }
        });
        let n = 1;
        while (usedNumbers.has(n)) {
          n++;
        }
        return `Project ${n}`;
      }

      // Create default project
      function createProjectObject(existingList, overrides = {}) {
        return {
          id: overrides.id || generateId(),
          title: overrides.title || getNextSmallestProjectName(existingList),
          html: overrides.html !== undefined ? overrides.html : 'Hello, World!',
          css: overrides.css !== undefined ? overrides.css : '',
          js: overrides.js !== undefined ? overrides.js : '',
          views: typeof overrides.views === 'number' ? overrides.views : 0,
          updatedAt: Date.now()
        };
      }

      // Load state from localStorage
      function loadState() {
        try {
          const rawProjects = localStorage.getItem(STORAGE_KEY);
          if (rawProjects) {
            const parsed = JSON.parse(rawProjects);
            if (Array.isArray(parsed) && parsed.length > 0) {
              projects = parsed.map(p => ({
                ...p,
                views: typeof p.views === 'number' ? p.views : 0
              }));
            }
          }
        } catch (e) {
          console.error(e);
        }

        if (projects.length === 0) {
          const initial = createProjectObject([]);
          projects = [initial];
        }

        const savedActiveId = localStorage.getItem(ACTIVE_ID_KEY);
        if (savedActiveId && projects.some(p => p.id === savedActiveId)) {
          activeProjectId = savedActiveId;
        } else {
          activeProjectId = projects[0].id;
        }

        try {
          const savedPanes = localStorage.getItem(PANES_KEY);
          if (savedPanes) {
            visiblePanes = { ...visiblePanes, ...JSON.parse(savedPanes) };
          }
        } catch (e) {}

        const savedSidebar = localStorage.getItem(SIDEBAR_KEY);
        if (savedSidebar !== null) {
          sidebarOpen = savedSidebar === 'true';
        }
      }

      // Save state to localStorage and notify other tabs
      function saveState(broadcast = true) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
          localStorage.setItem(ACTIVE_ID_KEY, activeProjectId);
          localStorage.setItem(PANES_KEY, JSON.stringify(visiblePanes));
          localStorage.setItem(SIDEBAR_KEY, String(sidebarOpen));
          if (broadcast && channel) {
            channel.postMessage({ type: 'SYNC_STATE' });
          }
        } catch (e) {
          console.error(e);
        }
      }

      // Increment Open count strictly for a single target project
      function incrementProjectViews(projectId) {
        const idx = projects.findIndex(p => p.id === projectId);
        if (idx !== -1) {
          projects[idx] = {
            ...projects[idx],
            views: (projects[idx].views || 0) + 1
          };
          saveState(true);
          renderSidebar();
          if (projectId === activeProjectId) {
            activeOpenCountEl.textContent = projects[idx].views;
          }
        }
      }

      // Check URL hash for shared project
      function checkSharedHash() {
        const hash = window.location.hash;
        if (!hash || !hash.startsWith('#share=')) return;

        try {
          const encoded = hash.slice(7);
          const decompressed = LZString.decompressFromEncodedURIComponent(encoded);
          if (!decompressed) return;
          const data = JSON.parse(decompressed);

          // Check if an identical shared ID or content exists
          let target = data.id ? projects.find(p => p.id === data.id) : null;
          if (target) {
            target.views = (target.views || 0) + 1;
            activeProjectId = target.id;
          } else {
            const newProj = createProjectObject(projects, {
              title: data.title || getNextSmallestProjectName(projects),
              html: data.html || '',
              css: data.css || '',
              js: data.js || '',
              views: 1
            });
            projects.unshift(newProj);
            activeProjectId = newProj.id;
          }

          if (data.panes) {
            visiblePanes = { ...visiblePanes, ...data.panes };
          }

          // Clean hash so reload doesn't duplicate endlessly
          history.replaceState(null, '', window.location.pathname + window.location.search);
          saveState(true);
        } catch (e) {
          console.error('Invalid share URL', e);
        }
      }

      function getActiveProject() {
        return projects.find(p => p.id === activeProjectId) || projects[0];
      }

      // Build compiled HTML document
      function buildFullHtml(proj) {
        const html = proj.html || '';
        const css = proj.css || '';
        const js = proj.js || '';

        const styleTag = css.trim() ? `<style>\n${css}\n</style>` : '';
        const scriptTag = js.trim() ? `<script>\n${js}\n<\/script>` : '';

        if (/<html[\s>]/i.test(html) || /<!doctype\s+html/i.test(html)) {
          let result = html;
          if (styleTag) {
            if (/<\/head>/i.test(result)) {
              result = result.replace(/<\/head>/i, `${styleTag}\n</head>`);
            } else {
              result = `${styleTag}\n${result}`;
            }
          }
          if (scriptTag) {
            if (/<\/body>/i.test(result)) {
              result = result.replace(/<\/body>/i, `${scriptTag}\n</body>`);
            } else {
              result = `${result}\n${scriptTag}`;
            }
          }
          return result;
        }

        return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${escapeHtml(proj.title)}</title>
  ${styleTag}
</head>
<body>
${html}
${scriptTag}
</body>
</html>`;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Render Line Numbers
      function updateLineNumbers(type) {
        const text = editors[type].value;
        const lines = text.split('\n').length;
        lineBadges[type].textContent = `${lines} ln`;

        let nums = '';
        for (let i = 1; i <= lines; i++) {
          nums += i + '\n';
        }
        lineEls[type].textContent = nums;
        lineEls[type].scrollTop = editors[type].scrollTop;
      }

      // Update Preview Frame
      let previewTimer = null;
      function updatePreview(immediate = false) {
        if (!visiblePanes.preview) return;
        const run = () => {
          const proj = getActiveProject();
          if (!proj) return;
          previewFrame.srcdoc = buildFullHtml(proj);
        };
        if (immediate) {
          clearTimeout(previewTimer);
          run();
        } else {
          clearTimeout(previewTimer);
          previewTimer = setTimeout(run, 180);
        }
      }

      // Render Sidebar Visibility
      function renderSidebarVisibility() {
        if (sidebarOpen) {
          projectSidebar.classList.remove('hidden');
          projectSidebar.classList.add('flex');
        } else {
          projectSidebar.classList.add('hidden');
          projectSidebar.classList.remove('flex');
        }
      }

      // Render Project Sidebar List (fixed height items, always visible action icons)
      function renderSidebar() {
        projectListEl.innerHTML = '';

        projects.forEach(proj => {
          const isActive = proj.id === activeProjectId;
          const item = document.createElement('div');
          item.className = `h-9 px-2 rounded border flex items-center justify-between gap-1.5 cursor-pointer transition-colors ${
            isActive
              ? 'bg-purple-50/90 border-purple-200 text-[#6D28D9]'
              : 'bg-white border-transparent hover:bg-slate-100 text-slate-700'
          }`;

          // Left: Title & Per-project Open count
          const leftArea = document.createElement('div');
          leftArea.className = 'flex items-center gap-1.5 min-w-0 flex-1';

          const nameSpan = document.createElement('span');
          nameSpan.className = `text-xs truncate ${isActive ? 'font-bold' : 'font-medium'}`;
          nameSpan.textContent = proj.title;

          const viewBadge = document.createElement('span');
          viewBadge.className = `text-[10px] px-1.5 py-0.2 rounded font-semibold tabular-nums flex-shrink-0 ${
            isActive
              ? 'bg-[#6D28D9] text-white'
              : 'bg-slate-100 text-slate-600'
          }`;
          viewBadge.title = 'Open数';
          viewBadge.textContent = proj.views || 0;

          leftArea.appendChild(nameSpan);
          leftArea.appendChild(viewBadge);

          // Right: Always-visible fixed-size action icons (Duplicate, Delete)
          const actionsArea = document.createElement('div');
          actionsArea.className = 'flex items-center gap-0.5 flex-shrink-0';

          const dupBtn = document.createElement('button');
          dupBtn.type = 'button';
          dupBtn.title = '複製';
          dupBtn.className = 'w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:text-slate-700 hover:bg-slate-200/70 transition-colors flex-shrink-0';
          dupBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`;
          dupBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            duplicateProject(proj.id);
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.title = '削除';
          delBtn.className = 'w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:text-red-600 hover:bg-red-50 transition-colors flex-shrink-0';
          delBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            requestDeleteProject(proj.id);
          });

          actionsArea.appendChild(dupBtn);
          actionsArea.appendChild(delBtn);

          item.appendChild(leftArea);
          item.appendChild(actionsArea);

          item.addEventListener('click', () => {
            selectProject(proj.id);
          });

          projectListEl.appendChild(item);
        });
      }

      // Render Panes Visibility
      function renderPanes() {
        document.querySelectorAll('.pane-toggle').forEach(btn => {
          const pane = btn.dataset.pane;
          if (visiblePanes[pane]) {
            btn.classList.add('bg-[#6D28D9]', 'text-white');
            btn.classList.remove('text-slate-600', 'hover:text-slate-900');
          } else {
            btn.classList.remove('bg-[#6D28D9]', 'text-white');
            btn.classList.add('text-slate-600', 'hover:text-slate-900');
          }
        });

        ['html', 'css', 'js', 'preview'].forEach(pane => {
          const el = document.getElementById(`pane-${pane}`);
          if (visiblePanes[pane]) {
            el.classList.remove('hidden');
            el.classList.add('flex');
          } else {
            el.classList.add('hidden');
            el.classList.remove('flex');
          }
        });

        if (visiblePanes.preview) {
          updatePreview(true);
        }
      }

      // Load active project into editors
      function renderActiveProject() {
        const proj = getActiveProject();
        if (!proj) return;

        activeTitleInput.value = proj.title;
        activeOpenCountEl.textContent = proj.views || 0;

        editors.html.value = proj.html || '';
        editors.css.value = proj.css || '';
        editors.js.value = proj.js || '';

        updateLineNumbers('html');
        updateLineNumbers('css');
        updateLineNumbers('js');
        updatePreview(true);
      }

      // Actions
      function selectProject(id) {
        if (!projects.some(p => p.id === id)) return;
        activeProjectId = id;
        saveState(false);
        renderSidebar();
        renderActiveProject();
      }

      function createNewProject() {
        const proj = createProjectObject(projects);
        projects.unshift(proj);
        activeProjectId = proj.id;
        saveState(true);
        renderSidebar();
        renderActiveProject();
      }

      function duplicateProject(id) {
        const source = projects.find(p => p.id === id);
        if (!source) return;
        const copy = createProjectObject(projects, {
          title: getNextSmallestProjectName(projects),
          html: source.html,
          css: source.css,
          js: source.js,
          views: 0
        });
        projects.unshift(copy);
        activeProjectId = copy.id;
        saveState(true);
        renderSidebar();
        renderActiveProject();
        showToast('プロジェクトを複製しました');
      }

      function openConfirmModal(title, message, onConfirm) {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').textContent = message;
        confirmCallback = onConfirm;
        document.getElementById('confirmModal').classList.remove('hidden');
      }

      function closeConfirmModal() {
        document.getElementById('confirmModal').classList.add('hidden');
        confirmCallback = null;
      }

      function requestDeleteProject(id) {
        const target = projects.find(p => p.id === id);
        if (!target) return;
        openConfirmModal(
          'プロジェクトの削除',
          `「${target.title}」を削除しますか？`,
          () => {
            projects = projects.filter(p => p.id !== id);
            if (projects.length === 0) {
              const fresh = createProjectObject([]);
              projects = [fresh];
            }
            if (!projects.some(p => p.id === activeProjectId)) {
              activeProjectId = projects[0].id;
            }
            saveState(true);
            renderSidebar();
            renderActiveProject();
            showToast('削除しました');
          }
        );
      }

      function requestDeleteAll() {
        openConfirmModal(
          'すべてのプロジェクトを削除',
          `保存されている全 ${projects.length} 件のプロジェクトを削除し、初期状態に戻しますか？`,
          () => {
            const fresh = createProjectObject([]);
            projects = [fresh];
            activeProjectId = fresh.id;
            saveState(true);
            renderSidebar();
            renderActiveProject();
            showToast('すべて削除しました');
          }
        );
      }

      // Toast helper
      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('hidden');
        }, 2000);
      }

      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => showToast('クリップボードにコピーしました'));
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('クリップボードにコピーしました');
        }
      }

      // Event Listeners
      toggleSidebarBtn.addEventListener('click', () => {
        sidebarOpen = !sidebarOpen;
        renderSidebarVisibility();
        saveState(false);
      });

      newProjectBtn.addEventListener('click', createNewProject);
      deleteAllBtn.addEventListener('click', requestDeleteAll);

      document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirmModal);
      document.getElementById('confirmOkBtn').addEventListener('click', () => {
        if (typeof confirmCallback === 'function') confirmCallback();
        closeConfirmModal();
      });

      // Panel Toggle Buttons (Multi-select)
      document.querySelectorAll('.pane-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const pane = btn.dataset.pane;
          const activeCount = Object.values(visiblePanes).filter(Boolean).length;
          if (visiblePanes[pane] && activeCount === 1) {
            return; // Keep at least 1 pane active
          }
          visiblePanes[pane] = !visiblePanes[pane];
          renderPanes();
          saveState(false);
        });
      });

      // Title input
      activeTitleInput.addEventListener('input', () => {
        const proj = getActiveProject();
        if (!proj) return;
        proj.title = activeTitleInput.value || 'Untitled';
        proj.updatedAt = Date.now();
        saveState(true);
        renderSidebar();
        updatePreview(false);
      });

      // Editors setup (input, scroll sync, Tab key indentation)
      ['html', 'css', 'js'].forEach(type => {
        const ta = editors[type];

        ta.addEventListener('input', () => {
          const proj = getActiveProject();
          if (!proj) return;
          proj[type] = ta.value;
          proj.updatedAt = Date.now();
          updateLineNumbers(type);
          saveState(true);
          updatePreview(false);
        });

        ta.addEventListener('scroll', () => {
          lineEls[type].scrollTop = ta.scrollTop;
        });

        ta.addEventListener('keydown', (e) => {
          if (e.key === 'Tab') {
            e.preventDefault();
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
            ta.selectionStart = ta.selectionEnd = start + 2;
            ta.dispatchEvent(new Event('input'));
          }
        });
      });

      refreshPreviewBtn.addEventListener('click', () => updatePreview(true));

      // Open in New Tab (increments Open count strictly for active project)
      openTabBtn.addEventListener('click', () => {
        const proj = getActiveProject();
        if (!proj) return;
        incrementProjectViews(proj.id);

        const fullHtml = buildFullHtml(proj);
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      });

      // Share Modal
      shareBtn.addEventListener('click', () => {
        const proj = getActiveProject();
        if (!proj) return;

        const payload = {
          id: proj.id,
          title: proj.title,
          html: proj.html,
          css: proj.css,
          js: proj.js,
          panes: visiblePanes
        };

        const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(payload));
        const baseUrl = window.location.href.split('#')[0];
        const shareUrl = `${baseUrl}#share=${compressed}`;

        const fullHtml = buildFullHtml(proj);
        const dataUri = 'data:text/html;charset=utf-8,' + encodeURIComponent(fullHtml);

        document.getElementById('shareUrlInput').value = shareUrl;
        document.getElementById('dataUriInput').value = dataUri;
        document.getElementById('shareModal').classList.remove('hidden');
      });

      document.getElementById('closeShareModalBtn').addEventListener('click', () => {
        document.getElementById('shareModal').classList.add('hidden');
      });

      document.getElementById('copyShareUrlBtn').addEventListener('click', () => {
        copyText(document.getElementById('shareUrlInput').value);
      });

      document.getElementById('copyDataUriBtn').addEventListener('click', () => {
        copyText(document.getElementById('dataUriInput').value);
      });

      // Export single HTML file
      exportHtmlBtn.addEventListener('click', () => {
        const proj = getActiveProject();
        if (!proj) return;
        const fullHtml = buildFullHtml(proj);
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        const safeName = (proj.title || 'project').replace(/[\\/:*?"<>|]/g, '_');
        a.download = `${safeName}.html`;
        a.click();
        URL.revokeObjectURL(a.href);
      });

      // Import HTML file
      importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const content = ev.target.result || '';
          const title = file.name.replace(/\.[^/.]+$/, '') || getNextSmallestProjectName(projects);
          const imported = createProjectObject(projects, {
            title,
            html: content,
            css: '',
            js: '',
            views: 0
          });
          projects.unshift(imported);
          activeProjectId = imported.id;
          saveState(true);
          renderSidebar();
          renderActiveProject();
          showToast('HTMLファイルを読み込みました');
        };
        reader.readAsText(file);
        importFileInput.value = '';
      });

      // Real-time Cross-Tab Synchronization
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
          loadState();
          renderSidebar();
          renderActiveProject();
        }
      });

      if (channel) {
        channel.onmessage = (event) => {
          if (event.data && event.data.type === 'SYNC_STATE') {
            loadState();
            renderSidebar();
            const current = getActiveProject();
            if (current) {
              activeOpenCountEl.textContent = current.views || 0;
            }
          }
        };
      }

      // Initialize App
      loadState();
      checkSharedHash();
      renderSidebarVisibility();
      renderSidebar();
      renderPanes();
      renderActiveProject();
    })();
  </script>
</body>
</html>
